# SPDX-License-Identifier: MIT
#
# Basis fork build: produce pinned z3 binaries for the platforms the Verus
# MCP server supports (arm64 macOS, x86 Linux), publish them as a per-commit
# GitHub release with sha256 checksums. Mirrors the BasisResearch/verus
# fork's build.yml/rolling-release.yml pattern, except artifacts land on a
# release so verus-tools-mcp can download them unauthenticated and verify
# against hardcoded hashes.

name: basis-build

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR builds share a group per branch so a new push cancels the superseded
  # run. Every other run gets a group per commit: a group holds only one
  # pending run, so a shared mainline group would still drop the middle one
  # of three quick pushes and leave that commit without a release.
  group: basis-build-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        build: [macos, linux]
        include:
          - build: macos
            os: macos-latest
            release_name: z3-arm64-macos
          - build: linux
            os: ubuntu-24.04
            release_name: z3-x86-linux

    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.3"

    steps:
      - uses: actions/checkout@v6

      - name: install ninja
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y ninja-build
          else
            brew install ninja
          fi

      - name: configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DZ3_BUILD_LIBZ3_SHARED=OFF
          -DZ3_BUILD_TEST_EXECUTABLES=OFF
          -DZ3_BUILD_PYTHON_BINDINGS=OFF
          -DZ3_BUILD_DOTNET_BINDINGS=OFF
          -DZ3_BUILD_JAVA_BINDINGS=OFF
          -DZ3_BUILD_DOCUMENTATION=OFF
          -DZ3_ENABLE_EXAMPLE_TARGETS=OFF

      - name: build
        run: cmake --build build --target shell

      - name: package
        shell: bash
        run: |
          strip build/z3 || true
          ./build/z3 --version
          cp build/z3 "${{ matrix.release_name }}"
          shasum -a 256 "${{ matrix.release_name }}" > "${{ matrix.release_name }}.sha256"
          cat "${{ matrix.release_name }}.sha256"

      - name: upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.release_name }}
          path: |
            ${{ matrix.release_name }}
            ${{ matrix.release_name }}.sha256
          if-no-files-found: error

  publish:
    if: github.event_name != 'pull_request'
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: download all artifacts
        uses: actions/download-artifact@v8

      - name: publish per-commit release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="basis-${GITHUB_SHA:0:10}"
          files=(
            z3-arm64-macos/z3-arm64-macos
            z3-arm64-macos/z3-arm64-macos.sha256
            z3-x86-linux/z3-x86-linux
            z3-x86-linux/z3-x86-linux.sha256
            SHA256SUMS
          )
          # The binaries are not byte-reproducible, so a re-run must not
          # replace a published release whose hash verus-tools-mcp may
          # already pin. An intentional replacement needs a manual
          # `gh release delete`. `gh release create` uploads assets to a
          # draft and publishes it last, so a draft here means an earlier
          # run was interrupted; nobody can have pinned it, so redo it.
          if release=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,assets 2>/dev/null); then
            if [ "$(jq -r .isDraft <<<"$release")" = true ]; then
              echo "::warning::deleting draft release $tag left by an interrupted run"
              gh release delete -y "$tag" --repo "$GITHUB_REPOSITORY"
            else
              missing=$(jq -r --args '$ARGS.positional - [.assets[].name] | join(" ")' \
                "${files[@]##*/}" <<<"$release")
              if [ -n "$missing" ]; then
                echo "::error::published release $tag is missing assets: $missing; delete it by hand to rebuild"
                exit 1
              fi
              echo "::notice::release $tag already exists with all assets; keeping it"
              exit 0
            fi
          fi
          cat */*.sha256 > SHA256SUMS
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Basis z3 build $tag" \
            --notes "$(printf 'Pinned Basis build of z3 at %s.\n\n```\n%s\n```' "$GITHUB_SHA" "$(cat SHA256SUMS)")" \
            "${files[@]}"
